[project]
name = "samskrta-multiparser"
# Keep in sync with postprocess_analysis.TOOL_VERSION, which is what the output documents record.
version = "1.0.0"
description = "Unified multi-engine Sanskrit analyzer: sanskrit_parser, Dharmamitra API, vidyut"
requires-python = ">=3.10"
# Upper bounds are deliberate: every engine here changes the published reading, and the pinned goldens plus the
# accuracy figures in ACCURACY.md were measured on the versions installed today. A new minor release of any of them
# is a change to be re-measured, not silently picked up. vidyut additionally has to match the shipped data
# directory (data-0.4.0); see README "Accuracy depends on the data directory".
dependencies = [
    "sanskrit-parser>=0.2.6,<0.3",
    "indic-transliteration>=2.3.82,<3",
    "vidyut>=0.4.0,<0.5",
    "requests>=2.34.2,<3",
]

[project.scripts]
samskrta = "app:main"
samskrta-postprocess = "postprocess_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "postprocess_analysis.py"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
